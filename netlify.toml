[build]
  publish = "."

[[redirects]]
  from = "/articles"
  to = "/#articles"
  status = 301

[[redirects]]
  from = "/newsletter"
  to = "/free-guide.html"
  status = 301

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
